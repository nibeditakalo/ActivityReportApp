androidxHilt = "1.3.0"
room = "2.8.4"
work = "2.11.0"
navigation3 = "1.0.0"
materialIcons = "1.7.8"
coroutines = "1.10.2"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
